# Orderbook API - Points to Barn (staging environment)
orderbook-url = "https://barn.api.cow.fi/mainnet/api"

# Python Solver Configuration
[[solver]]
name = "baseline-python"
endpoint = "http://127.0.0.1:8080/baseline/"
absolute-slippage = "40000000000000000" # 0.04 ETH in wei
relative-slippage = "0.1" # 10% slippage tolerance
account = "0x2a871d0798f97d79848a013d4936a73bf4cc922c825d33c1cf7073dff6d409c6" # Test private key
merge-solutions = true
response-size-limit-max-bytes = 30000000

[[solver]]
name = "python-solver"
endpoint = "http://127.0.0.1:8080/mysolver/"
absolute-slippage = "40000000000000000"
relative-slippage = "0.1"
account = "0x2a871d0798f97d79848a013d4936a73bf4cc922c825d33c1cf7073dff6d409c6"
merge-solutions = true
response-size-limit-max-bytes = 30000000

